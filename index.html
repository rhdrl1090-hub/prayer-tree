<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECEFE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131913" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="기도나무">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
html { -webkit-text-size-adjust: 100%; color-scheme: light dark; }
body { margin: 0; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>기도나무</title>
<style>
@font-face {
  font-family: "Jeju Gothic";
  src: local("Jeju Gothic"), local("JejuGothic"), url("JejuGothic.ttf") format("truetype");
  font-weight: 400; font-style: normal; font-display: swap;
}
/* Layout: one narrow phone column of soft pastel cards — verse note, little hill with a blossoming tree, round-day calendar, lined memo; year view swaps in 12 pink bars. */
:root {
  --bg: #FFF5F6;
  --surface: #FFFFFF;
  --ink: #4A3A40;
  --muted: #A08D94;
  --line: #F5DEE4;
  --shadow: rgba(214, 140, 160, .16);
  --leaf: #6FB383;
  --leaf-soft: #E4F4E7;
  --leaf-2: #A6D6AE;
  --bark: #A0705A;
  --bark-soft: #FFEFE6;
  --butter: #FFF4CC;
  --sky: #EEF6FF;
  --sat: #6E95D6;
  --sun-day: #E4637F;
  --blossom: #F8BFCE;
  --blossom-deep: #EE8FAA;
  --blossom-core: #D5577A;
  --blossom-soft: #FFE6EC;
  --on-accent: #FFFFFF;
  --font: "Jeju Gothic", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1F1A1D; --surface: #2A2327; --ink: #F5EAEE; --muted: #B9A6AE; --line: #3D3238; --shadow: rgba(0,0,0,.35);
    --leaf: #8FCB9C; --leaf-soft: #263A2C; --leaf-2: #5E9A6C; --bark: #CFA084; --bark-soft: #3A2C2A;
    --butter: #3B3524; --sky: #232B36; --sat: #97B6EA; --sun-day: #F28CA3;
    --blossom: #EBA3B8; --blossom-deep: #E07D9A; --blossom-core: #FFD3DE; --blossom-soft: #43303A; --on-accent: #2A2327;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1A1D; --surface: #2A2327; --ink: #F5EAEE; --muted: #B9A6AE; --line: #3D3238; --shadow: rgba(0,0,0,.35);
  --leaf: #8FCB9C; --leaf-soft: #263A2C; --leaf-2: #5E9A6C; --bark: #CFA084; --bark-soft: #3A2C2A;
  --butter: #3B3524; --sky: #232B36; --sat: #97B6EA; --sun-day: #F28CA3;
  --blossom: #EBA3B8; --blossom-deep: #E07D9A; --blossom-core: #FFD3DE; --blossom-soft: #43303A; --on-accent: #2A2327;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 15px; line-height: 1.6; font-weight: 400;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(18px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px));
}
b, strong, h1, h2 { font-weight: 400; }
.app { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-inline: 4px; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand svg { width: 34px; height: 34px; flex: none; }
h1 { font-size: 1.55rem; margin: 0; letter-spacing: -0.02em; color: var(--blossom-core); }
.brand small { display: block; font-size: .74rem; color: var(--muted); margin-top: -2px; }
.save-state { font-size: .74rem; color: var(--muted); }
.card { background: var(--surface); border-radius: 26px; padding: 18px; box-shadow: 0 8px 22px var(--shadow); }
button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--blossom); outline-offset: 2px; }
.label { font-size: .78rem; color: var(--muted); }

/* verse */
.verse { position: relative; background: linear-gradient(160deg, var(--blossom-soft), var(--bark-soft)); overflow: hidden; }
.verse::before { content: ""; position: absolute; right: -18px; bottom: -22px; width: 90px; height: 90px; border-radius: 50%; background: var(--blossom); opacity: .25; pointer-events: none; }
.verse::after { content: ""; position: absolute; right: 46px; bottom: -14px; width: 40px; height: 40px; border-radius: 50%; background: var(--blossom-deep); opacity: .15; pointer-events: none; }
.verse blockquote { position: relative; margin: 8px 0 0; font-size: 1.1rem; line-height: 1.8; white-space: pre-wrap; text-wrap: pretty; }
.verse cite { display: inline-block; margin-top: 10px; font-style: normal; font-size: .82rem; color: var(--blossom-core); background: var(--surface); border-radius: 999px; padding: 3px 12px; }
.verse .empty { color: var(--muted); }
.verse-head { position: relative; display: flex; justify-content: space-between; align-items: center; }
.link-btn { background: var(--surface); border: 0; border-radius: 999px; padding: 5px 14px; font-size: .82rem; color: var(--blossom-core); box-shadow: 0 2px 8px var(--shadow); }
.verse-form { position: relative; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
textarea, input[type="text"] {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; resize: vertical;
}
#verseText { min-height: 90px; }
::placeholder { color: var(--muted); opacity: .75; }
.row-end { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.btn { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 18px; font-size: .9rem; }
.btn.primary { background: var(--blossom-deep); border-color: var(--blossom-deep); color: var(--on-accent); }

/* tabs + nav */
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-radius: 999px; padding: 5px; box-shadow: 0 4px 14px var(--shadow); }
.tabs button { border: 0; background: none; border-radius: 999px; padding: 9px; font-size: .95rem; color: var(--muted); transition: background .2s, color .2s; }
.tabs button[aria-selected="true"] { background: var(--blossom-deep); color: var(--on-accent); }
.nav { display: flex; align-items: center; justify-content: space-between; }
.nav h2 { margin: 0; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.nav-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--blossom-soft); color: var(--blossom-core); display: grid; place-items: center; padding: 0; }
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn:active { transform: scale(.92); }
.today-btn { font-size: .76rem; color: var(--blossom-core); background: none; border: 0; padding: 2px 6px; }

/* tree */
.tree-card { background: linear-gradient(180deg, var(--sky), var(--surface) 75%); position: relative; }
.tree-wrap svg { width: 100%; max-width: 100%; height: auto; display: block; }
.tree-count { position: absolute; right: 16px; bottom: 14px; background: var(--surface); border-radius: 18px; padding: 6px 12px; text-align: center; box-shadow: 0 4px 12px var(--shadow); }
.tree-count b { display: block; font-size: 1.8rem; line-height: 1.1; color: var(--blossom-core); font-variant-numeric: tabular-nums; }
.tree-count span { font-size: .72rem; color: var(--muted); }
.bloom { transform-box: fill-box; transform-origin: 50% 50%; }
.bloom.new { animation: bloom .8s cubic-bezier(.2,.9,.3,1.4); }
@keyframes bloom { from { transform: scale(0) rotate(-120deg); opacity: 0; } }
.petal-fall { animation: fall 2.6s ease-in forwards; }
@keyframes fall { to { transform: translate(var(--dx), 120px) rotate(260deg); opacity: 0; } }
.cloud { animation: drift 9s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translateX(14px); } }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px 4px; }
.dow { text-align: center; font-size: .78rem; color: var(--muted); padding-bottom: 2px; }
.dow.sun { color: var(--sun-day); }
.dow.sat { color: var(--sat); }
.day {
  position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border: 2px solid transparent; border-radius: 50%;
  background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  font-size: .92rem; font-variant-numeric: tabular-nums; padding: 0; line-height: 1.1;
}
.day.sun { color: var(--sun-day); }
.day.sat { color: var(--sat); }
.day:hover { background: var(--blossom-soft); }
.day.today { border: 2px dashed var(--leaf); }
.day.on { background: var(--blossom); color: var(--blossom-core); }
.day.on.pop { animation: pop .35s ease-out; }
@keyframes pop { 40% { transform: scale(1.18); } }
.day svg { width: 15px; height: 15px; }
.day .dot { width: 15px; height: 15px; }
.hint { font-size: .78rem; color: var(--muted); margin: 12px 0 0; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border-radius: 20px; padding: 10px 12px; min-width: 0; background: var(--blossom-soft); }
.stat:nth-child(2) { background: var(--leaf-soft); }
.stat:nth-child(3) { background: var(--butter); }
.stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat b small { font-size: .8rem; color: var(--muted); margin-left: 2px; }

/* selected day + notes */
.day.sel { box-shadow: 0 0 0 3px var(--blossom-deep); }
.day .has-note { position: absolute; top: 3px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--leaf); }
.day-title { font-size: 1.1rem; color: var(--blossom-core); }
.check-btn {
  width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
  border: 2px dashed var(--blossom-deep); background: var(--surface); color: var(--blossom-core);
  border-radius: 999px; padding: 11px 16px; font-size: 1rem; transition: transform .15s;
}
.check-btn svg { width: 22px; height: 22px; }
.check-btn[aria-pressed="true"] { border-style: solid; background: var(--blossom); }
.check-btn:active { transform: scale(.97); }
.note-list { display: flex; flex-direction: column; margin-top: 6px; }
.note-item { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; border: 0; background: none; padding: 10px 4px; border-bottom: 2px dotted var(--line); }
.note-item:last-child { border-bottom: 0; }
.note-item .d { color: var(--blossom-core); font-size: .86rem; font-variant-numeric: tabular-nums; }
.note-item .t { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.note-empty { color: var(--muted); font-size: .86rem; margin: 8px 0 0; }

/* memo: lined note paper */
#memo, .lined {
  min-height: 128px; margin-top: 12px; border: 0; border-radius: 16px; padding: 4px 14px;
  line-height: 32px; background: repeating-linear-gradient(var(--surface) 0 31px, var(--line) 31px 32px);
  background-attachment: local;
}
.memo-head { display: flex; justify-content: space-between; align-items: baseline; }

/* two pages side by side: swipe or tap the switch */
.page-switch { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
.page-switch button {
  border: 0; border-radius: 18px; padding: 8px 4px; background: var(--surface); color: var(--muted);
  box-shadow: 0 4px 14px var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: .8rem; line-height: 1.2; white-space: nowrap;
}
.page-switch button svg { width: 18px; height: 18px; }
.page-switch button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.pager {
  display: flex; gap: 32px; align-items: flex-start; overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
  margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px;
  transition: height .25s ease;
}
.pager::-webkit-scrollbar { display: none; }
.page { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; display: flex; flex-direction: column; gap: 14px; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: -4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: width .2s, background .2s; }
.dots i.on { width: 20px; border-radius: 999px; background: var(--blossom-deep); }

/* sermon / QT notes */
.week-head { text-align: center; min-width: 0; }
.week-head h2 { font-size: 1.12rem; }
.week-chip { display: inline-block; font-size: .72rem; padding: 2px 10px; border-radius: 999px; background: var(--leaf-soft); color: var(--leaf); margin-top: 2px; }
.word-card { display: flex; flex-direction: column; gap: 6px; }
.word-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.word-head h3 { margin: 0; font-size: 1.08rem; font-weight: 400; flex: 1; min-width: 0; }
.kind-chip { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: .8rem; }
.k-sun .kind-chip { background: var(--blossom-soft); color: var(--blossom-core); }
.k-fri .kind-chip { background: var(--sky); color: var(--sat); }
.k-qt .kind-chip { background: var(--leaf-soft); color: var(--leaf); }
.k-memo .kind-chip { background: var(--blossom-soft); color: var(--blossom-core); }
.k-youth .kind-chip { background: var(--butter); color: var(--bark); }
.ref-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.field-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.full-btn { border: 0; border-radius: 999px; padding: 3px 10px; font-size: .74rem; background: var(--blossom-soft); color: var(--blossom-core); }
.longable.long[readonly], .word-text.long[readonly] {
  cursor: pointer; overflow: hidden;
  -webkit-mask-image: linear-gradient(#000 62%, transparent); mask-image: linear-gradient(#000 62%, transparent);
}
/* full-verse popup */
.sheet-backdrop {
  position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
  background: rgba(60, 30, 42, .45);
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  animation: fadein .2s ease-out;
}
.sheet {
  width: 100%; max-width: 460px; max-height: 100%; display: flex; flex-direction: column;
  background: var(--surface); border-radius: 26px; box-shadow: 0 18px 40px rgba(0,0,0,.25);
  animation: sheetin .28s cubic-bezier(.2,.9,.3,1.2);
}
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 18px 18px 10px; }
.sheet-head h3 { margin: 0; font-size: 1.15rem; font-weight: 400; color: var(--blossom-core); flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sheet-x { flex: none; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--blossom-soft); color: var(--blossom-core); display: grid; place-items: center; padding: 0; }
.sheet-x svg { width: 18px; height: 18px; }
.sheet-body { overflow-y: auto; padding: 4px 22px 14px; font-size: 1.12rem; line-height: 1.95; overscroll-behavior: contain; }
.sheet-body p { margin: 0 0 .55em; overflow-wrap: anywhere; white-space: pre-wrap; }
.sheet-body .vn { color: var(--blossom-core); font-size: .72em; margin-right: 5px; vertical-align: .38em; font-variant-numeric: tabular-nums; }
.sheet-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px 16px; border-top: 2px dotted var(--line); }
.sheet-foot .ref-link { margin: 0; }
.sheet-btns { display: flex; gap: 8px; margin-left: auto; }
.btn.danger { color: var(--sun-day); border-color: var(--blossom-soft); }
.btn.danger.armed { background: var(--sun-day); border-color: var(--sun-day); color: var(--on-accent); }

/* 기도 노트: people to pray for */
.add-person { width: 100%; margin-top: 12px; padding: 11px; font-size: 1rem; }
.people-list { display: flex; flex-direction: column; gap: 10px; }
.person {
  display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left;
  border: 0; background: var(--surface); border-radius: 22px; padding: 14px; box-shadow: 0 6px 18px var(--shadow); width: 100%;
}
.person:active { transform: scale(.985); }
.avatar {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none;
  font-size: 1.15rem; background: var(--blossom-soft); color: var(--blossom-core);
}
.avatar.c1 { background: var(--leaf-soft); color: var(--leaf); }
.avatar.c2 { background: var(--butter); color: var(--bark); }
.avatar.c3 { background: var(--sky); color: var(--sat); }
.person .info { display: block; min-width: 0; }
.person .who { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.person .nm { font-size: 1.08rem; }
.person .rf { font-size: .76rem; color: var(--blossom-core); background: var(--blossom-soft); border-radius: 999px; padding: 1px 9px; }
.person .vs { font-size: .84rem; color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.person .pr { font-size: .9rem; margin-top: 6px; padding-top: 6px; border-top: 2px dotted var(--line); white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.person .pr:empty, .person .vs:empty { display: none; }
.person .pr::before { content: "기도제목"; display: block; font-size: .7rem; color: var(--blossom-core); margin-bottom: 1px; }
.sheet-verse { background: var(--blossom-soft); border-radius: 16px; padding: 10px 14px; margin-bottom: 12px; font-size: .92rem; line-height: 1.7; }
.sheet-verse .sv-ref { font-size: .78rem; color: var(--blossom-core); }
.sheet-verse .sv-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.sheet-body p.pt { position: relative; padding-left: 20px; margin-bottom: .5em; }
.sheet-body p.pt::before { content: ""; position: absolute; left: 4px; top: .8em; width: 8px; height: 8px; border-radius: 50%; background: var(--blossom-deep); }
.pt-empty { color: var(--muted); }
.people-empty { text-align: center; color: var(--muted); font-size: .88rem; padding: 18px 8px; }
.sheet-body.person-form { font-size: 1rem; line-height: 1.6; display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
.person-form .word-text { min-height: 110px; }
.person-form .lined { margin-top: 0; min-height: 160px; box-shadow: inset 0 0 0 2px var(--line); }
.person-form input[type="text"], .person-form .word-text { background: var(--bg); border-color: transparent; }
@keyframes fadein { from { opacity: 0; } }
@keyframes sheetin { from { transform: translateY(24px) scale(.97); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .sheet-backdrop, .sheet { animation: none; } }
.copy-btn { border: 0; border-radius: 999px; padding: 6px 12px; font-size: .8rem; background: var(--bg); color: var(--muted); }
.field-label { font-size: .78rem; color: var(--muted); margin-top: 4px; }
.word-text { min-height: 96px; background: var(--bg); border-color: transparent; }
.word-card .lined { margin-top: 0; box-shadow: inset 0 0 0 2px var(--line); }
.word-card input[type="text"] { background: var(--bg); border-color: transparent; }
.filled-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--leaf); flex: none; }
.week-item { grid-template-columns: 96px minmax(0, 1fr); }
.qt-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-bottom: 2px; }
.qt-day {
  position: relative; border: 2px solid transparent; background: var(--leaf-soft); border-radius: 16px;
  padding: 6px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.15;
}
.qt-day .w { font-size: .7rem; color: var(--muted); }
.qt-day .n { font-size: .95rem; font-variant-numeric: tabular-nums; }
.qt-day.sun .w { color: var(--sun-day); }
.qt-day.sat .w { color: var(--sat); }
.qt-day.today { border-color: var(--leaf); border-style: dashed; }
.qt-day.sel { background: var(--leaf); color: var(--on-accent); border-style: solid; border-color: var(--leaf); }
.qt-day.sel .w { color: var(--on-accent); }
.qt-day.has::after { content: ""; position: absolute; top: 4px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--blossom-deep); }
.qt-date { font-size: .82rem; color: var(--leaf); margin-top: 4px; }
.ref-link {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; margin-top: 2px;
  padding: 6px 12px; border-radius: 999px; background: var(--blossom-soft); color: var(--blossom-core);
  font-size: .82rem; text-decoration: none; max-width: 100%;
}
.ref-link svg { width: 16px; height: 16px; flex: none; }

<script>
(function () {
  const now = new Date();
  const S = {
    view: 'month',
    y: now.getFullYear(),
    m: now.getMonth() + 1,
    years: {},          // { "2026": { days: { "10": [1,3] }, notes: { "10": { "3": "..." } }, memo: {} (old monthly memos) } }
    verse: { text: '', ref: '' },
    sel: now.getDate(),  // selected day in the month view
    word: {},            // { "2026-10-18" (week's Sunday): { sun|fri|youth: {...}, qtd: { "0".."6": {...} } } }
    people: [],          // [{ id, name, ref, verse, prayer }] — 기도 노트

  };
  function defaultSel() { return S.y === now.getFullYear() && S.m === now.getMonth() + 1 ? now.getDate() : 1; }
  const $ = id => document.getElementById(id);
  const LS_KEY = 'prayer-tree-v1';

  /* ---------- storage: each phone keeps its own record in its browser ---------- */
  let storageOk = true;
  function lsLoad() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) { const d = JSON.parse(raw); S.years = d.years || {}; S.verse = d.verse || S.verse; S.word = d.word || {}; S.people = Array.isArray(d.people) ? d.people : []; }
    } catch (e) { storageOk = false; }
  }
  function setSaving(t) { $('saveState').textContent = t; }
  function persist() {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({ years: S.years, verse: S.verse, word: S.word, people: S.people }));
      setSaving('이 휴대폰에 저장됨');
    } catch (e) {
      storageOk = false;
      setSaving('저장하지 못했어요');
      $('storeNote').textContent = '이 브라우저는 저장을 막고 있어요(시크릿 모드 등). 일반 모드로 열어 주세요.';
    }
    return Promise.resolve();
  }

  /* ---------- data helpers ---------- */
  function yearDoc(y) {
    y = String(y);
    if (!S.years[y]) S.years[y] = { days: {}, notes: {}, memo: {} };
    const doc = S.years[y];
    if (!doc.days) doc.days = {};
    if (!doc.notes) doc.notes = {};
    if (!doc.memo) doc.memo = {};
    return doc;
  }
  function monthDays(y, m) { const d = S.years[String(y)]; return (d && d.days && d.days[String(m)]) || []; }
  function monthMemo(y, m) { const d = S.years[String(y)]; return (d && d.memo && d.memo[String(m)]) || ''; }
  function monthNotes(y, m) { const d = S.years[String(y)]; return (d && d.notes && d.notes[String(m)]) || {}; }
  function dayNote(y, m, day) { return monthNotes(y, m)[String(day)] || ''; }
  const WD = ['일', '월', '화', '수', '목', '금', '토'];
  function yearTotal(y) { const d = S.years[String(y)]; if (!d) return 0; return Object.values(d.days).reduce((a, v) => a + v.length, 0); }
  function allTotal() { return Object.keys(S.years).reduce((a, y) => a + yearTotal(y), 0); }
  function daysIn(y, m) { return new Date(y, m, 0).getDate(); }

  /* ---------- tree ---------- */
  // fixed leaf spots across the canopy, filled in order as the month grows
  const spots = (function () {
    let s = 7; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    const out = [];
    let gap = 28, tries = 0;
    while (out.length < 31) {
      if (++tries > 4000) { gap -= 1; tries = 0; }
      const x = 150 + (rnd() * 2 - 1) * 120, y = 84 + (rnd() * 2 - 1) * 70;
      if (((x - 150) / 124) ** 2 + ((y - 84) / 72) ** 2 > 1) continue;
      if (out.some(p => Math.hypot(p.x - x, p.y - y) < gap)) continue;
      out.push({ x, y, r: Math.round(rnd() * 72) });
    }
    return out; // random order, so each new blossom lands somewhere new on the tree
  })();
  function blossom(x, y, r, size, isNew) {
    const k = size;
    let p = '';
    for (let i = 0; i < 5; i++) {
      // notched cherry petal pointing up, rotated around the centre
      p += '<path transform="rotate(' + (i * 72) + ')" d="M0 0 C' + (-4.6 * k) + ' ' + (-2.5 * k) + ' ' + (-5 * k) + ' ' + (-8 * k) + ' ' + (-1.6 * k) + ' ' + (-9.4 * k) +
        ' L0 ' + (-8 * k) + ' L' + (1.6 * k) + ' ' + (-9.4 * k) + ' C' + (5 * k) + ' ' + (-8 * k) + ' ' + (4.6 * k) + ' ' + (-2.5 * k) + ' 0 0 Z" fill="var(--blossom)" stroke="var(--blossom-deep)" stroke-width=".5"/>';
    }
    p += '<circle r="' + (2.2 * k) + '" fill="var(--blossom-deep)"/>';
    for (let i = 0; i < 5; i++) {
      const a = (i * 72 + 36) * Math.PI / 180;
      p += '<circle cx="' + (Math.sin(a) * 3.4 * k).toFixed(2) + '" cy="' + (-Math.cos(a) * 3.4 * k).toFixed(2) + '" r="' + (0.7 * k) + '" fill="var(--blossom-core)"/>';
    }
    return '<g transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + r + ')"><g class="bloom' + (isNew ? ' new' : '') + '">' + p + '</g></g>';
  }
  function fallingPetal(x, y, i) {
    const dx = (i % 2 ? 1 : -1) * (18 + i * 9);
    return '<g transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ')"><path class="petal-fall" style="--dx:' + dx + 'px;animation-delay:' + (0.3 + i * 0.35) + 's" d="M0 0 C-3 -2 -3 -6 -1 -7 L0 -6 L1 -7 C3 -6 3 -2 0 0 Z" fill="var(--blossom)"/></g>';
  }
  let lastLeafCount = null, lastLeafKey = '';
  function drawTree(count) {
    const key = S.y + '-' + S.m;
    const prev = key === lastLeafKey && lastLeafCount !== null ? lastLeafCount : count;
    // little scene: sun, drifting cloud, soft canopy glow
    let h = '<circle cx="34" cy="34" r="15" fill="var(--butter)"/><circle cx="34" cy="34" r="10" fill="#FFD66B" opacity=".9"/>';
    h += '<ellipse cx="150" cy="86" rx="130" ry="78" fill="var(--blossom-soft)" opacity=".75"/>';
    h += '<g class="cloud" fill="var(--surface)"><ellipse cx="236" cy="26" rx="18" ry="9"/><ellipse cx="250" cy="19" rx="13" ry="11"/><ellipse cx="264" cy="27" rx="14" ry="8"/></g>';
    h += '<path d="M141 210 C144 180 146 150 143 118 L157 118 C154 150 156 180 159 210 Z" fill="var(--bark)"/>';
    h += '<g fill="none" stroke="var(--bark)" stroke-linecap="round">' +
      '<path d="M148 140 C130 120 104 112 78 96" stroke-width="5"/>' +
      '<path d="M152 132 C172 112 198 104 226 88" stroke-width="5"/>' +
      '<path d="M150 122 C148 96 152 70 150 40" stroke-width="5"/>' +
      '<path d="M104 110 C96 92 98 74 92 58" stroke-width="3"/>' +
      '<path d="M200 102 C210 86 206 70 214 54" stroke-width="3"/>' +

  function renderYear() {

  /* ---------- 말씀 노트 (weekly services) and QT (daily) ---------- */

  const KINDS = [

  const FIELDS = ['ref', 'title', 'text', 'think'];
  function sundayOf(d) { const s = new Date(d.getFullYear(), d.getMonth(), d.getDate()); s.setDate(s.getDate() - s.getDay()); return s; }
  function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fromYmd(s) { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); }

  const thisWeek = ymd(sundayOf(now));

  }

  /* ---------- Bible reference → 대한성서공회 개역개정 page ---------- */
  const BOOKS = [
    ['gen', '창세기', '창'], ['exo', '출애굽기', '출'], ['lev', '레위기', '레'], ['num', '민수기', '민'], ['deu', '신명기', '신'],

    ['neh', '느헤미야', '느'], ['est', '에스더', '에'], ['job', '욥기', '욥'], ['psa', '시편', '시'], ['pro', '잠언', '잠'],
    ['ecc', '전도서', '전'], ['sng', '아가', '아'], ['isa', '이사야', '사'], ['jer', '예레미야', '렘'], ['lam', '예레미야애가', '애', '애가'],

    ['oba', '오바댜', '옵'], ['jnh', '요나', '욘'], ['mic', '미가', '미'], ['nam', '나훔', '나'], ['hab', '하박국', '합'],
    ['zep', '스바냐', '습'], ['hag', '학개', '학'], ['zec', '스가랴', '슥'], ['mal', '말라기', '말'],
    ['mat', '마태복음', '마'], ['mrk', '마가복음', '막'], ['luk', '누가복음', '눅'], ['jhn', '요한복음', '요'], ['act', '사도행전', '행'],

    ['php', '빌립보서', '빌'], ['col', '골로새서', '골'], ['1th', '데살로니가전서', '살전'], ['2th', '데살로니가후서', '살후'],
    ['1ti', '디모데전서', '딤전'], ['2ti', '디모데후서', '딤후'], ['tit', '디도서', '딛'], ['phm', '빌레몬서', '몬'], ['heb', '히브리서', '히'],
    ['jas', '야고보서', '약'], ['1pe', '베드로전서', '벧전'], ['2pe', '베드로후서', '벧후'], ['1jn', '요한일서', '요일', '요한1서'],
    ['2jn', '요한이서', '요이', '요한2서'], ['3jn', '요한삼서', '요삼', '요한3서'], ['jud', '유다서', '유'], ['rev', '요한계시록', '계', '계시록']
  ];
  const BOOK_NAMES = BOOKS.flatMap(b => b.slice(1).map(n => [n, b[0], b[1]])).sort((a, b) => b[0].length - a[0].length);
  function parseRef(s) {
    const t = (s || '').replace(/\s+/g, '');
    const hit = BOOK_NAMES.find(([n]) => t.startsWith(n));
    if (!hit) return null;
    const m = t.slice(hit[0].length).match(/^(\d{1,3})(?:장|편)?(?:[:.,]?(\d{1,3})절?)?(?:[-~](\d{1,3}))?/);
    if (!m) return null;
    return { code: hit[1], book: hit[2], chap: +m[1], sec: m[2] ? +m[2] : 0, to: m[3] ? +m[3] : 0 };
  }
  // text copied from the 갓피플성경 app looks like "[호2:16] 여호와께서 … [호2:17] 내가 …"
  function parseCopiedVerses(raw) {
    const s = (raw || '').trim();
    const re = /\[([^\]]{2,20})\]\s*/g;
    const toks = [];
    let m;
    while ((m = re.exec(s))) { const r = parseRef(m[1]); if (r && r.sec) toks.push({ r, at: m.index, end: re.lastIndex }); }
    if (!toks.length || toks[0].at > 3) return null;
    const verses = toks.map((t, i) => ({ r: t.r, body: s.slice(t.end, i + 1 < toks.length ? toks[i + 1].at : s.length).trim() }));
    const a = verses[0].r, same = verses.every(v => v.r.code === a.code && v.r.chap === a.chap);
    const secs = verses.map(v => v.r.to ? [v.r.sec, v.r.to] : [v.r.sec]).flat();
    const lo = Math.min(...secs), hi = Math.max(...secs);
    const ref = same
      ? a.book + ' ' + a.chap + ':' + lo + (hi > lo ? '-' + hi : '')
      : refLabel(a) + ' 외';
    const text = verses.length === 1 ? verses[0].body
      : verses.map(v => (same ? v.r.sec : refLabel(v.r)) + ' ' + v.body).join('\n');
    return { ref, text };
  }
  function refLabel(r) { return r.book + ' ' + r.chap + (r.sec ? ':' + r.sec + (r.to ? '-' + r.to : '') : '장'); }
  function bibleUrl(r) {
    return 'https://www.bskorea.or.kr/bible/korbibReadpage.php?version=GAE&book=' + r.code + '&chap=' + r.chap + '&sec=' + (r.sec || 1);
  }

    const r = parseRef(value);

  function fieldsHtml(k, titleLabel) {
    return '<label class="field-label" for="' + k + '-ref">본문</label>' +
      '<input type="text" id="' + k + '-ref" data-kind="' + k + '" data-field="ref" placeholder="예) 요한복음 15:1-8" autocomplete="off">' +

      '<button type="button" class="full-btn" data-full="' + k + '" hidden>전체 보기</button></div>' +
      '<textarea class="word-text" id="' + k + '-text" data-kind="' + k + '" data-field="text" placeholder="말씀을 적거나, 갓피플성경에서 복사한 구절을 붙여넣으세요. 본문 칸도 함께 채워져요."></textarea>' +
      '<label class="field-label" for="' + k + '-think">내 생각</label>' +
      '<textarea class="lined" id="' + k + '-think" data-kind="' + k + '" data-field="think" placeholder="말씀을 통해 느낀 점, 삶에 적용할 점을 적어 보세요."></textarea>';
  }
  $('wordCards').innerHTML = KINDS.map(K =>
    '<section class="card word-card k-' + K.k + '">' +
      '<div class="word-head"><span class="kind-chip">' + K.chip + '</span><h3>' + K.name + '</h3>' +
      '<span class="save-state" id="st-' + K.k + '"></span></div>' + fieldsHtml(K.k, '설교 제목') +
    '</section>').join('');
  $('qtCard').innerHTML =
    '<section class="card word-card k-qt">' +
      '<div class="word-head"><span class="kind-chip">QT</span><h3 id="qtDate"></h3><span class="save-state" id="st-qt"></span></div>' +
      '<div class="qt-days" id="qtDays" role="tablist" aria-label="QT 요일"></div>' + fieldsHtml('qt', '묵상 제목') +
    '</section>';

  function fillFields(k, part) {
    FIELDS.forEach(f => { const el = $(k + '-' + f); if (document.activeElement !== el) el.value = (part && part[f]) || ''; });
    updateRefLink($(k + '-link'), $(k + '-ref').value);
    markLong(k);
  }

  /* ---------- long 말씀: tapping the field opens the whole passage in a popup ---------- */
  // key is a service kind (sun / fri / youth / qt) or 'memo' for the daily prayer memo
  function elFor(k) { return k === 'memo' ? $('memo') : (k ? $(k + '-text') : null); }
  function keyOf(el) { return el.id === 'memo' ? 'memo' : el.dataset.kind; }
  function markLong(k) {
    const el = elFor(k), btn = document.querySelector('[data-full="' + k + '"]');
    if (!el || el.dataset.editing) return;
    el.readOnly = false; el.classList.remove('long');
    const long = !!el.value.trim() && el.scrollHeight > el.clientHeight + 4;
    el.classList.toggle('long', long);
    el.readOnly = long;            // read-only so a tap opens the popup instead of the keyboard
    if (btn) btn.hidden = !long;
  }
  let sheetKind = null, sheetReturn = null, sheetOnEdit = null;
  function openSheet(k) {
    const el = elFor(k); if (!el || !el.value.trim()) return;
    sheetKind = k; sheetReturn = document.activeElement; sheetOnEdit = null;
    const K = KINDS.find(x => x.k === k);
    $('sheet').querySelector('.sheet').className = 'sheet k-' + k;
    $('sheetChip').textContent = k === 'memo' ? '기도' : K ? K.chip : 'QT';
    const ref = k === 'memo' ? '' : $(k + '-ref').value.trim();
    $('sheetTitle').textContent = k === 'memo' ? $('selTitle').textContent.replace(' · 오늘', '') + ' 기도 메모'
      : ref || (K ? K.name + ' 말씀' : 'QT 말씀');
    const body = $('sheetBody'); body.innerHTML = '';
    el.value.split(/\n+/).forEach(line => {
      if (!line.trim()) return;
      const p = document.createElement('p');
      const m = line.match(/^(\d{1,3})\s+(.*)$/);
      if (m) { const n = document.createElement('span'); n.className = 'vn'; n.textContent = m[1]; p.appendChild(n); p.appendChild(document.createTextNode(m[2])); }
      else p.textContent = line;
      body.appendChild(p);
    });
    body.scrollTop = 0;
    const link = $('sheetLink'), r = parseRef(ref);
    if (r) { link.hidden = false; link.href = bibleUrl(r); link.innerHTML = OPEN_ICON + '<span></span>'; link.querySelector('span').textContent = '개역개정 보기'; }
    else link.hidden = true;
    $('sheet').hidden = false;
    document.documentElement.style.overflow = 'hidden';
    $('sheetDone').focus();
  }
  function closeSheet(edit) {
    if ($('sheet').hidden) return;
    $('sheet').hidden = true;
    document.documentElement.style.overflow = '';
    const k = sheetKind; sheetKind = null;
    if (edit && sheetOnEdit) { const f = sheetOnEdit; sheetOnEdit = null; f(); return; }
    sheetOnEdit = null;
    if (edit && k) {
      const el = elFor(k);
      el.dataset.editing = '1'; el.readOnly = false; el.classList.remove('long');
      const btn = document.querySelector('[data-full="' + k + '"]'); if (btn) btn.hidden = true;
      el.focus(); el.setSelectionRange(el.value.length, el.value.length);
    } else if (sheetReturn && sheetReturn.focus) sheetReturn.focus({ preventScroll: true });
  }
  document.addEventListener('click', e => {
    // a field left after editing goes back to tap-to-open (backup for browsers that skip focusout)
    document.querySelectorAll('.word-text[data-editing], .longable[data-editing]').forEach(t => {
      if (t !== e.target && document.activeElement !== t) { delete t.dataset.editing; markLong(keyOf(t)); }
    });
    const full = e.target.closest('[data-full]');
    if (full) { openSheet(full.dataset.full); return; }
    const ta = e.target.closest('.word-text.long, .longable.long');
    if (ta && ta.readOnly) openSheet(keyOf(ta));
  });
  document.addEventListener('focusout', e => {
    const ta = e.target;
    if (ta.classList && (ta.classList.contains('word-text') || ta.classList.contains('longable'))) { delete ta.dataset.editing; markLong(keyOf(ta)); }
  });
  $('sheetClose').addEventListener('click', () => closeSheet(false));
  $('sheetDone').addEventListener('click', () => closeSheet(false));
  $('sheetEdit').addEventListener('click', () => closeSheet(true));
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) closeSheet(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(false); });

  // 말씀 노트
  function renderWord() {
    const wk = ymd(S.week);
    $('weekTitle').textContent = weekTitle(S.week);
    $('weekChip').textContent = wk === thisWeek ? '이번 주' : S.week.getFullYear() + '년';
    $('wToday').hidden = wk === thisWeek;
    const entry = S.word[wk] || {};
    KINDS.forEach(K => fillFields(K.k, entry[K.k]));
    renderWeekList();
  }
  function renderWeekList() {
    const keys = Object.keys(S.word).filter(k => KINDS.some(K => filled(S.word[k][K.k]))).sort().reverse();
    const box = $('weekList'); box.innerHTML = '';
    if (!keys.length) {
      const p = document.createElement('p'); p.className = 'note-empty';
      p.textContent = '아직 기록한 말씀이 없어요. 이번 주 주일예배 말씀부터 적어 보세요.';
      box.appendChild(p); return;
    }
    keys.slice(0, 30).forEach(k => {
      const d = fromYmd(k), e = S.word[k];
      const ks = KINDS.filter(K => filled(e[K.k]));
      const first = ks.map(K => e[K.k].title || e[K.k].ref).find(Boolean) || '';
      const b = document.createElement('button'); b.type = 'button'; b.className = 'note-item week-item'; b.dataset.week = k;
      b.innerHTML = '<span class="d"></span><span class="t"></span>';
      b.querySelector('.d').textContent = (d.getFullYear() !== now.getFullYear() ? String(d.getFullYear()).slice(2) + '.' : '') + (d.getMonth() + 1) + '/' + d.getDate() + ' 주간';
      b.querySelector('.t').textContent = ks.map(K => K.chip).join(' · ') + (first ? ' — ' + first : '');
      box.appendChild(b);
    });
  }

  // QT
  function renderQt() {
    const wk = ymd(S.qweek), entry = S.word[wk] || {};
    $('qWeekTitle').textContent = weekTitle(S.qweek);
    $('qWeekChip').textContent = wk === thisWeek ? '이번 주' : S.qweek.getFullYear() + '년';
    const sd = addDays(S.qweek, S.qtDay), isToday = ymd(sd) === ymd(now);
    $('qToday').hidden = isToday;
    let h = '';
    for (let i = 0; i < 7; i++) {
      const d = addDays(S.qweek, i);
      const has = !!(entry.qtd && filled(entry.qtd[String(i)]));
      h += '<button type="button" role="tab" class="qt-day' + (i === S.qtDay ? ' sel' : '') + (has ? ' has' : '') +
        (ymd(d) === ymd(now) ? ' today' : '') + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '" data-qd="' + i +
        '" aria-selected="' + (i === S.qtDay) + '"><span class="w">' + WD[i] + '</span><span class="n">' + d.getDate() + '</span></button>';
    }
    $('qtDays').innerHTML = h;
    $('qtDate').textContent = (sd.getMonth() + 1) + '월 ' + sd.getDate() + '일 (' + WD[S.qtDay] + ') QT' + (isToday ? ' · 오늘' : '');
    fillFields('qt', entry.qtd && entry.qtd[String(S.qtDay)]);
    renderQtList();
  }
  function renderQtList() {
    const items = [];
    Object.keys(S.word).forEach(wk => {
      const q = S.word[wk].qtd; if (!q) return;
      Object.keys(q).forEach(i => { if (filled(q[i])) items.push({ wk, i: +i, date: addDays(fromYmd(wk), +i), p: q[i] }); });
    });
    items.sort((a, b) => b.date - a.date);
    const box = $('qtList'); box.innerHTML = '';
    if (!items.length) {
      const p = document.createElement('p'); p.className = 'note-empty';
      p.textContent = '아직 기록한 QT가 없어요. 오늘 묵상한 말씀부터 적어 보세요.';
      box.appendChild(p); return;
    }
    items.slice(0, 40).forEach(it => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'note-item week-item';
      b.dataset.qwk = it.wk; b.dataset.qd = it.i;
      b.innerHTML = '<span class="d"></span><span class="t"></span>';
      const d = it.date;
      b.querySelector('.d').textContent = (d.getFullYear() !== now.getFullYear() ? String(d.getFullYear()).slice(2) + '.' : '') + (d.getMonth() + 1) + '/' + d.getDate() + ' (' + WD[d.getDay()] + ')';
      b.querySelector('.t').textContent = [it.p.ref, it.p.title].filter(Boolean).join(' — ') || (it.p.think || it.p.text || '').slice(0, 40);
      box.appendChild(b);
    });
  }

  // typing: one handler for both pages; saving waits for a pause
  let wordTimer = null, wordDirty = new Set();
  function flushWord() {
    if (!wordDirty.size) return;
    clearTimeout(wordTimer);
    persist();
    wordDirty.forEach(k => { $('st-' + k).textContent = '저장됨'; });
    if (wordDirty.has('qt')) { renderQtList(); renderQtDaysOnly(); }
    if ([...wordDirty].some(k => k !== 'qt')) renderWeekList();
    wordDirty.clear();
    fitPager();
  }
  function renderQtDaysOnly() {
    const entry = S.word[ymd(S.qweek)] || {};
    document.querySelectorAll('#qtDays .qt-day').forEach(b => b.classList.toggle('has', !!(entry.qtd && filled(entry.qtd[b.dataset.qd]))));
  }
  function onFieldInput(e) {
    const el = e.target, kind = el.dataset.kind, field = el.dataset.field;
    if (!kind) return;
    const wk = ymd(kind === 'qt' ? S.qweek : S.week);
    const entry = S.word[wk] || (S.word[wk] = {});
    let holder = entry, key = kind;
    if (kind === 'qt') { holder = entry.qtd || (entry.qtd = {}); key = String(S.qtDay); }
    const part = holder[key] || (holder[key] = {});
    if (el.value.trim()) part[field] = el.value; else delete part[field];
    if (!Object.keys(part).length) delete holder[key];
    if (entry.qtd && !Object.keys(entry.qtd).length) delete entry.qtd;
    if (!Object.keys(entry).length) delete S.word[wk];
    if (field === 'ref') updateRefLink($(kind + '-link'), el.value);
    wordDirty.add(kind);
    $('st-' + kind).textContent = '입력 중…';
    clearTimeout(wordTimer); wordTimer = setTimeout(flushWord, 800);
  }
  ['wordCards', 'qtCard'].forEach(id => {
    $(id).addEventListener('input', onFieldInput);
    $(id).addEventListener('focusout', flushWord);
    // pasting a verse copied from 갓피플성경 fills 본문 and 말씀 together
    $(id).addEventListener('paste', e => {
      const el = e.target, kind = el.dataset && el.dataset.kind;
      if (!kind || (el.dataset.field !== 'ref' && el.dataset.field !== 'text')) return;
      const got = parseCopiedVerses((e.clipboardData || window.clipboardData).getData('text'));
      if (!got) return;
      e.preventDefault();
      const refEl = $(kind + '-ref'), textEl = $(kind + '-text');
      refEl.value = got.ref;
      textEl.value = textEl.value.trim() ? textEl.value.trimEnd() + '\n' + got.text : got.text;
      refEl.dispatchEvent(new Event('input', { bubbles: true }));
      textEl.dispatchEvent(new Event('input', { bubbles: true }));
      $('st-' + kind).textContent = '구절을 채웠어요';
    });
  });

  function moveWeek(step) {
    flushWord();
    S.week = addDays(S.week, step * 7);
    KINDS.forEach(K => { $('st-' + K.k).textContent = ''; });
    renderWord(); fitPager();
  }
  $('wPrev').addEventListener('click', () => moveWeek(-1));
  $('wNext').addEventListener('click', () => moveWeek(1));
  $('wToday').addEventListener('click', () => { flushWord(); S.week = sundayOf(now); renderWord(); fitPager(); });
  $('weekList').addEventListener('click', e => {
    const b = e.target.closest('[data-week]'); if (!b) return;
    flushWord(); S.week = fromYmd(b.dataset.week); renderWord(); fitPager();
    $('pageWord').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  function setQt(weekSun, day) {
    flushWord(); S.qweek = weekSun; S.qtDay = day; $('st-qt').textContent = ''; renderQt(); fitPager();
  }
  $('qPrev').addEventListener('click', () => setQt(addDays(S.qweek, -7), S.qtDay));
  $('qNext').addEventListener('click', () => setQt(addDays(S.qweek, 7), S.qtDay));
  $('qToday').addEventListener('click', () => setQt(sundayOf(now), now.getDay()));
  $('qtCard').addEventListener('click', e => {
    const b = e.target.closest('.qt-day'); if (!b) return;
    setQt(S.qweek, +b.dataset.qd);
  });
  $('qtList').addEventListener('click', e => {
    const b = e.target.closest('[data-qwk]'); if (!b) return;
    setQt(fromYmd(b.dataset.qwk), +b.dataset.qd);
    $('pageQt').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  /* ---------- 기도 노트: people to pray for ---------- */
  const P_FIELDS = ['name', 'ref', 'verse', 'prayer'];
  let pCur = null, pTimer = null, pDirty = false, pDeleteArmed = false;
  function avatarOf(p, i) {
    const ch = (p.name || '').trim().charAt(0) || '?';
    return { ch, cls: 'avatar c' + (i % 4) };
  }
  function renderPeople() {
    const list = $('peopleList'); list.innerHTML = '';
    $('peopleCount').textContent = S.people.length ? S.people.length + '명' : '';
    if (!S.people.length) {
      const p = document.createElement('p'); p.className = 'people-empty';
      p.textContent = '아직 적어 둔 사람이 없어요. "+ 사람 추가"를 눌러 가족, 친구, 공동체 지체를 적어 보세요.';
      list.appendChild(p); return;
    }
    S.people.forEach((p, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'person'; b.dataset.pid = p.id;
      const av = avatarOf(p, i);
      b.innerHTML = '<span class="' + av.cls + '"></span><span class="info"><span class="who"><span class="nm"></span><span class="rf"></span></span>' +
        '<span class="vs"></span><span class="pr"></span></span>';
      b.querySelector('.avatar').textContent = av.ch;
      b.querySelector('.nm').textContent = p.name || '이름 없음';
      const rf = b.querySelector('.rf'); if (p.ref) rf.textContent = p.ref; else rf.remove();
      b.querySelector('.vs').textContent = p.verse || '';
      b.querySelector('.pr').textContent = p.prayer || '';
      list.appendChild(b);
    });
  }
  function pEmpty(p) { return !P_FIELDS.some(f => p[f] && p[f].trim()); }
  function openPerson(id) {
    let p = S.people.find(x => x.id === id);
    if (!p) { p = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }; S.people.push(p); }
    pCur = p; pDeleteArmed = false;
    $('pDelete').textContent = '삭제'; $('pDelete').classList.remove('armed');
    P_FIELDS.forEach(f => { $('p' + f.charAt(0).toUpperCase() + f.slice(1)).value = p[f] || ''; });
    paintPersonHead();
    updateRefLink($('pLink'), $('pRef').value);
    $('pState').textContent = '';
    $('pSheet').hidden = false;
    $('pSheet').querySelector('.sheet-body').scrollTop = 0;
    document.documentElement.style.overflow = 'hidden';
    if (!p.name) $('pName').focus();
  }
  function paintPersonHead() {
    const i = S.people.indexOf(pCur), av = avatarOf(pCur, i < 0 ? 0 : i);
    $('pAvatar').className = av.cls; $('pAvatar').textContent = av.ch;
    $('pTitle').textContent = pCur.name && pCur.name.trim() ? pCur.name : '새로운 사람';
  }
  function flushPerson() {
    if (!pDirty) return;
    pDirty = false; clearTimeout(pTimer);
    persist(); $('pState').textContent = '저장됨';
  }
  function closePerson() {
    if ($('pSheet').hidden) return;
    flushPerson();
    if (pCur && pEmpty(pCur)) { S.people = S.people.filter(x => x !== pCur); persist(); }
    pCur = null;
    $('pSheet').hidden = true;
    document.documentElement.style.overflow = '';
    renderPeople(); fitPager();
  }
  $('pSheet').addEventListener('input', e => {
    const f = e.target.dataset.pf; if (!f || !pCur) return;
    const v = e.target.value;
    if (v.trim()) pCur[f] = v; else delete pCur[f];
    if (f === 'name') paintPersonHead();
    if (f === 'ref') updateRefLink($('pLink'), v);
    pDirty = true; $('pState').textContent = '입력 중…';
    clearTimeout(pTimer); pTimer = setTimeout(flushPerson, 800);
  });
  $('pVerse').addEventListener('paste', e => {
    const got = parseCopiedVerses((e.clipboardData || window.clipboardData).getData('text'));
    if (!got) return;
    e.preventDefault();
    $('pRef').value = got.ref;
    $('pVerse').value = $('pVerse').value.trim() ? $('pVerse').value.trimEnd() + '\n' + got.text : got.text;
    $('pRef').dispatchEvent(new Event('input', { bubbles: true }));
    $('pVerse').dispatchEvent(new Event('input', { bubbles: true }));
  });
  // read view of one person's 기도제목 in the shared popup; 수정하기 opens the editor
  function openPersonView(id) {
    const p = S.people.find(x => x.id === id); if (!p) return;
    sheetKind = null; sheetReturn = document.activeElement; sheetOnEdit = () => openPerson(id);
    $('sheet').querySelector('.sheet').className = 'sheet k-memo';
    $('sheetChip').textContent = (p.name || '?').trim().charAt(0) || '?';
    $('sheetTitle').textContent = (p.name || '이름 없음') + ' 기도제목';
    const body = $('sheetBody'); body.innerHTML = '';
    if (p.ref || p.verse) {
      const box = document.createElement('div'); box.className = 'sheet-verse';
      if (p.ref) { const r = document.createElement('div'); r.className = 'sv-ref'; r.textContent = '신년예배 말씀 · ' + p.ref; box.appendChild(r); }
      if (p.verse) { const v = document.createElement('div'); v.className = 'sv-text'; v.textContent = p.verse; box.appendChild(v); }
      body.appendChild(box);
    }
    const lines = (p.prayer || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
    if (!lines.length) { const e = document.createElement('p'); e.className = 'pt-empty'; e.textContent = '아직 적어 둔 기도제목이 없어요.'; body.appendChild(e); }
    lines.forEach(line => { const el = document.createElement('p'); el.className = 'pt'; el.textContent = line.replace(/^[-•·*]\s*/, ''); body.appendChild(el); });
    body.scrollTop = 0;
    const link = $('sheetLink'), r = parseRef(p.ref);
    if (r) { link.hidden = false; link.href = bibleUrl(r); link.innerHTML = OPEN_ICON + '<span></span>'; link.querySelector('span').textContent = '개역개정 보기'; }
    else link.hidden = true;
    $('sheet').hidden = false;
    document.documentElement.style.overflow = 'hidden';
    $('sheetDone').focus();
  }
  $('addPerson').addEventListener('click', () => openPerson(null));
  $('peopleList').addEventListener('click', e => {
    const b = e.target.closest('[data-pid]'); if (!b) return;
    if (e.target.closest('.pr')) openPersonView(b.dataset.pid); else openPerson(b.dataset.pid);
  });
  $('pDone').addEventListener('click', closePerson);
  $('pClose').addEventListener('click', closePerson);
  $('pSheet').addEventListener('click', e => { if (e.target === $('pSheet')) closePerson(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePerson(); });
  $('pDelete').addEventListener('click', () => {
    if (!pCur) return;
    if (!pDeleteArmed) {
      pDeleteArmed = true; $('pDelete').textContent = '한 번 더 누르면 삭제'; $('pDelete').classList.add('armed');
      return;
    }
    S.people = S.people.filter(x => x !== pCur); pCur = null; pDirty = false; clearTimeout(pTimer);
    persist();
    $('pSheet').hidden = true; document.documentElement.style.overflow = '';
    renderPeople(); fitPager();
  });

  /* ---------- pager: swipe sideways between 기도 기록, 기도 노트, 말씀 노트, QT ---------- */
  const pager = $('pager'), pages = [$('pagePray'), $('pagePeople'), $('pageWord'), $('pageQt')];
  const tabs = [$('goPray'), $('goPeople'), $('goWord'), $('goQt')];
  let curPage = 0;
  function fitPager() { pager.style.height = pages[curPage].offsetHeight + 'px'; }
  function setPage(i) {
    if (i === curPage) return;
    curPage = i;
    tabs.forEach((t, j) => t.setAttribute('aria-selected', j === i));
    document.querySelectorAll('.dots i').forEach((d, j) => d.classList.toggle('on', j === i));
    fitPager();
    const top = pager.getBoundingClientRect().top + window.scrollY - 120;
    if (window.scrollY > top) window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
  pager.addEventListener('scroll', () => {
    const step = pages[1].offsetLeft - pages[0].offsetLeft;
    setPage(Math.max(0, Math.min(pages.length - 1, Math.round(pager.scrollLeft / step))));
  }, { passive: true });
  function goPage(i) { pager.scrollTo({ left: pages[i].offsetLeft - pages[0].offsetLeft, behavior: 'smooth' }); }
  tabs.forEach((t, i) => t.addEventListener('click', () => goPage(i)));
  if (window.ResizeObserver) { const ro = new ResizeObserver(fitPager); pages.forEach(p => ro.observe(p)); }
  window.addEventListener('resize', fitPager);

  // verse editing
  function openVerse(open) {
    $('verseForm').hidden = !open; $('verseView').hidden = open; $('verseEdit').hidden = open;
    if (open) { $('verseText').value = S.verse.text; $('verseRef').value = S.verse.ref; $('verseText').focus(); }
  }
  $('verseText').addEventListener('paste', e => {
    const got = parseCopiedVerses((e.clipboardData || window.clipboardData).getData('text'));
    if (!got) return;
    e.preventDefault();
    $('verseText').value = got.text; $('verseRef').value = got.ref;
  });
  $('verseEdit').addEventListener('click', () => openVerse(true));
  $('verseCancel').addEventListener('click', () => openVerse(false));
  $('verseForm').addEventListener('submit', e => {
    e.preventDefault();
    S.verse = { text: $('verseText').value.trim(), ref: $('verseRef').value.trim() };
    openVerse(false); render(); persist('verse');
  });

  // backup: the whole record as one code the person can keep anywhere
  function makeCode() {
    const json = JSON.stringify({ v: 3, years: S.years, verse: S.verse, word: S.word, people: S.people });
    return 'PT1:' + btoa(unescape(encodeURIComponent(json)));
  }
  $('backupCopy').addEventListener('click', () => {
    const code = makeCode(), box = $('backupBox');
    box.value = code; box.hidden = false;
    const done = () => { $('backupMsg').textContent = '백업 코드를 복사했어요. 안전한 곳에 붙여넣어 보관하세요.'; };
    const fallback = () => { box.focus(); box.select(); $('backupMsg').textContent = '아래 코드를 길게 눌러 전체 선택 후 복사해 주세요.'; };
    try { navigator.clipboard.writeText(code).then(done, fallback); } catch (e) { fallback(); }
  });
  let restoreArmed = false;
  $('restoreOpen').addEventListener('click', () => { $('restoreArea').hidden = false; $('restoreText').focus(); });
  $('restoreCancel').addEventListener('click', () => {
    $('restoreArea').hidden = true; restoreArmed = false; $('restoreGo').textContent = '불러오기'; $('backupMsg').textContent = '';
  });
  $('restoreGo').addEventListener('click', () => {
    let data;
    try {
      const raw = $('restoreText').value.trim().replace(/^PT1:/, '');
      data = JSON.parse(decodeURIComponent(escape(atob(raw))));
      if (!data || typeof data.years !== 'object') throw 0;
    } catch (e) { $('backupMsg').textContent = '백업 코드를 읽을 수 없어요. 코드 전체를 빠짐없이 붙여넣었는지 확인해 주세요.'; return; }
    if (!restoreArmed) {
      restoreArmed = true; $('restoreGo').textContent = '네, 덮어쓰기';
      $('backupMsg').textContent = '지금 이 휴대폰의 기록이 백업 내용으로 바뀌어요. 계속하려면 한 번 더 눌러 주세요.';
      return;
    }
    S.years = data.years || {}; S.verse = data.verse || { text: '', ref: '' }; S.word = data.word || {}; migrateWord();
    S.people = Array.isArray(data.people) ? data.people : []; renderPeople();
    persist(); renderWord(); renderQt(); restoreArmed = false; $('restoreGo').textContent = '불러오기';
    $('restoreArea').hidden = true; $('restoreText').value = '';
    $('backupMsg').textContent = '백업을 불러왔어요.';
    render();
  });

  lsLoad();
  if (!storageOk) $('storeNote').textContent = '이 브라우저는 저장을 막고 있어요(시크릿 모드 등). 일반 모드로 열어 주세요.';
  else $('storeNote').textContent = '로그인 없이 이 휴대폰에만 저장돼요. 다른 사람의 기록과 섞이지 않아요.';
  $('goPrayIcon').innerHTML = blossom(0, 0, 0, 0.95, false).replace('class="bloom"', '');
  migrateWord();
  render();
  renderWord();
  renderQt();
  renderPeople();
  fitPager();
  // the bundled font can change line heights, so re-measure long fields once it is ready
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { ['memo', 'sun', 'fri', 'youth', 'qt'].forEach(markLong); fitPager(); });
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
